# Add as a manual dashboard card after configuring Traccar Server.
# Replace device_tracker.pablo if your integration generated a different entity ID.
type: vertical-stack
cards:
  - type: map
    title: Car location
    entities:
      - device_tracker.pablo
    hours_to_show: 2
    default_zoom: 15
  - type: entities
    title: Car tracker
    entities:
      - entity: device_tracker.pablo
        name: Pablo
        secondary_info: last-updated
      - entity: switch.pablo_output
        name: Autó kimenet (GPIO23)
        secondary_info: last-changed

name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master ]

jobs:
  # ── Job 1: Host-side unit tests ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (host)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get install -y gcc make

      - name: Build & run unit tests
        working-directory: firmware/test
        run: make

      - name: Check setup JavaScript and provisioning workflow
        run: |
          python -c "from pathlib import Path; import re; html=Path('firmware/components/tracker_setup/setup.html').read_text(encoding='utf-8'); print(re.search(r'<script>(.*?)</script>', html, re.S).group(1))" > /tmp/tracker-setup.js
          node --check /tmp/tracker-setup.js
          node firmware/components/tracker_setup/test/test_setup_ui.cjs
          python -m py_compile tools/provision_tracker.py
          python tools/test_provision_tracker.py
          python -m py_compile tools/configure_tracker_access.py
          python tools/test_configure_tracker_access.py

  # ── Job 2: Static analysis ──────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck on portable tracker sources
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress=unusedFunction \
            --suppress=unusedStructMember \
            --suppress=checkersReport \
            --error-exitcode=1 \
            --std=c11 \
            -U ESP_PLATFORM \
            -I firmware/components/tracker_core/include \
            -I firmware/components/tracker_store/include \
            -I firmware/components/tracker_output/include \
            -I firmware/components/tracker_setup \
            -I firmware/main \
            firmware/components/tracker_core/tracker_core.c \
            firmware/components/tracker_store/tracker_store.c \
            firmware/components/tracker_output/tracker_output.c \
            firmware/components/tracker_setup/setup_policy.c \
            firmware/main/tracker_policy.c \
            2>&1

  # ── Job 3: ESP-IDF build ─────────────────────────────────────────────────────
  esp-idf-build:
    name: ESP-IDF Build (esp32)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32
          path: firmware
